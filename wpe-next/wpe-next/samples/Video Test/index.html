<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Fullscreen Video</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body,
            html {
                height: 100%;
                overflow: hidden;
                background: #000;
            }

            video {
                width: 100vw;
                height: 100vh;
                object-fit: contain;
                display: block;
            }
        </style>
    </head>
    <body>
        <video autoplay muted loop playsinline>
            <source src="video.mp4" type="video/mp4" />
        </video>
    </body>
</html>
