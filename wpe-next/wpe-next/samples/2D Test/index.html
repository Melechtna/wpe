<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>2D Test</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body,
            html {
                height: 100%;
                background: #000;
                overflow: hidden;
            }
            canvas {
                display: block;
            }
        </style>
    </head>
    <body>
        <canvas id="c"></canvas>

        <script>
            const canvas = document.getElementById("c");
            const ctx = canvas.getContext("2d");

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener("resize", resize);
            resize();

            let x = canvas.width / 2;
            let y = canvas.height / 2;

            ctx.globalAlpha = 0.92;

            function randomColor() {
                const r = Math.floor(Math.random() * 256);
                const g = Math.floor(Math.random() * 256);
                const b = Math.floor(Math.random() * 256);
                return `rgb(${r},${g},${b})`;
            }

            let hue = Math.random() * 360;
            let lastColor = `hsl(${hue}, 100%, 60%)`;

            function animate() {
                ctx.fillStyle = "rgba(0,0,0,0.04)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                const step = 20 + Math.random() * 60;
                const angle = Math.random() * Math.PI * 2;

                const newX = x + Math.cos(angle) * step;
                const newY = y + Math.sin(angle) * step;

                x = (newX + canvas.width) % canvas.width;
                y = (newY + canvas.height) % canvas.height;

                if (Math.random() < 0.08) {
                    hue = Math.random() * 360;
                    lastColor = `hsl(${hue}, 100%, ${60 + Math.random() * 30}%)`;
                }

                ctx.strokeStyle = lastColor;
                ctx.lineWidth = 2 + Math.random() * 5;
                ctx.lineCap = "round";

                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(newX, newY);
                ctx.stroke();

                x = newX;
                y = newY;

                requestAnimationFrame(animate);
            }

            animate();
        </script>
    </body>
</html>
