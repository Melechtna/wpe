<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGL 3D Test Scene</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            background: #0a0a0f;
        }
        canvas { 
            display: block; 
            width: 100vw; 
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="glCanvas"></canvas>
    <script>
        const canvas = document.getElementById('glCanvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

        if (!gl) {
            alert('WebGL not supported');
            throw new Error('WebGL not supported');
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            gl.viewport(0, 0, canvas.width, canvas.height);
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const vsSource = `
            attribute vec4 aPosition;
            attribute vec3 aNormal;
            
            uniform mat4 uModelMatrix;
            uniform mat4 uViewMatrix;
            uniform mat4 uProjectionMatrix;
            uniform mat3 uNormalMatrix;
            
            varying vec3 vNormal;
            varying vec3 vPosition;
            
            void main() {
                vec4 worldPos = uModelMatrix * aPosition;
                vPosition = worldPos.xyz;
                vNormal = uNormalMatrix * aNormal;
                gl_Position = uProjectionMatrix * uViewMatrix * worldPos;
            }
        `;

        const fsSource = `
            precision mediump float;
            
            varying vec3 vNormal;
            varying vec3 vPosition;
            
            uniform vec3 uLightPos;
            uniform vec3 uCameraPos;
            uniform vec3 uColor;
            
            void main() {
                vec3 normal = normalize(vNormal);
                vec3 lightDir = normalize(uLightPos - vPosition);
                vec3 viewDir = normalize(uCameraPos - vPosition);
                vec3 halfDir = normalize(lightDir + viewDir);
                
                float ambient = 0.15;
                float diffuse = max(dot(normal, lightDir), 0.0) * 0.7;
                float specular = pow(max(dot(normal, halfDir), 0.0), 32.0) * 0.5;
                
                vec3 color = uColor * (ambient + diffuse) + vec3(1.0) * specular;
                gl_FragColor = vec4(color, 1.0);
            }
        `;

        const particleVsSource = `
            attribute vec4 aPosition;
            uniform mat4 uViewMatrix;
            uniform mat4 uProjectionMatrix;
            uniform float uPointSize;
            
            void main() {
                gl_Position = uProjectionMatrix * uViewMatrix * aPosition;
                gl_PointSize = uPointSize;
            }
        `;

        const particleFsSource = `
            precision mediump float;
            uniform vec3 uColor;
            
            void main() {
                float dist = length(gl_PointCoord - vec2(0.5));
                if (dist > 0.5) discard;
                float alpha = 1.0 - smoothstep(0.3, 0.5, dist);
                gl_FragColor = vec4(uColor, alpha * 0.6);
            }
        `;

        function createShader(type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                console.error(gl.getShaderInfoLog(shader));
                gl.deleteShader(shader);
                return null;
            }
            return shader;
        }

        function createProgram(vsSource, fsSource) {
            const vs = createShader(gl.VERTEX_SHADER, vsSource);
            const fs = createShader(gl.FRAGMENT_SHADER, fsSource);
            const program = gl.createProgram();
            gl.attachShader(program, vs);
            gl.attachShader(program, fs);
            gl.linkProgram(program);
            if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
                console.error(gl.getProgramInfoLog(program));
                return null;
            }
            return program;
        }

        const mainProgram = createProgram(vsSource, fsSource);
        const particleProgram = createProgram(particleVsSource, particleFsSource);

        const mainLocations = {
            aPosition: gl.getAttribLocation(mainProgram, 'aPosition'),
            aNormal: gl.getAttribLocation(mainProgram, 'aNormal'),
            uModelMatrix: gl.getUniformLocation(mainProgram, 'uModelMatrix'),
            uViewMatrix: gl.getUniformLocation(mainProgram, 'uViewMatrix'),
            uProjectionMatrix: gl.getUniformLocation(mainProgram, 'uProjectionMatrix'),
            uNormalMatrix: gl.getUniformLocation(mainProgram, 'uNormalMatrix'),
            uLightPos: gl.getUniformLocation(mainProgram, 'uLightPos'),
            uCameraPos: gl.getUniformLocation(mainProgram, 'uCameraPos'),
            uColor: gl.getUniformLocation(mainProgram, 'uColor'),
        };

        const particleLocations = {
            aPosition: gl.getAttribLocation(particleProgram, 'aPosition'),
            uViewMatrix: gl.getUniformLocation(particleProgram, 'uViewMatrix'),
            uProjectionMatrix: gl.getUniformLocation(particleProgram, 'uProjectionMatrix'),
            uPointSize: gl.getUniformLocation(particleProgram, 'uPointSize'),
            uColor: gl.getUniformLocation(particleProgram, 'uColor'),
        };

        function createIcosahedron() {
            const t = (1 + Math.sqrt(5)) / 2;
            const vertices = [
                -1, t, 0,  1, t, 0,  -1, -t, 0,  1, -t, 0,
                0, -1, t,  0, 1, t,  0, -1, -t,  0, 1, -t,
                t, 0, -1,  t, 0, 1,  -t, 0, -1,  -t, 0, 1
            ];
            
            const indices = [
                0, 11, 5,  0, 5, 1,  0, 1, 7,  0, 7, 10,  0, 10, 11,
                1, 5, 9,  5, 11, 4,  11, 10, 2,  10, 7, 6,  7, 1, 8,
                3, 9, 4,  3, 4, 2,  3, 2, 6,  3, 6, 8,  3, 8, 9,
                4, 9, 5,  2, 4, 11,  6, 2, 10,  8, 6, 7,  9, 8, 1
            ];

            const positions = [];
            const normals = [];
            
            for (let i = 0; i < indices.length; i += 3) {
                const i0 = indices[i] * 3, i1 = indices[i + 1] * 3, i2 = indices[i + 2] * 3;
                
                const v0 = [vertices[i0], vertices[i0 + 1], vertices[i0 + 2]];
                const v1 = [vertices[i1], vertices[i1 + 1], vertices[i1 + 2]];
                const v2 = [vertices[i2], vertices[i2 + 1], vertices[i2 + 2]];
                
                const edge1 = [v1[0] - v0[0], v1[1] - v0[1], v1[2] - v0[2]];
                const edge2 = [v2[0] - v0[0], v2[1] - v0[1], v2[2] - v0[2]];
                
                let normal = [
                    edge1[1] * edge2[2] - edge1[2] * edge2[1],
                    edge1[2] * edge2[0] - edge1[0] * edge2[2],
                    edge1[0] * edge2[1] - edge1[1] * edge2[0]
                ];
                
                const len = Math.sqrt(normal[0]**2 + normal[1]**2 + normal[2]**2);
                normal = [normal[0]/len, normal[1]/len, normal[2]/len];
                
                positions.push(...v0, ...v1, ...v2);
                normals.push(...normal, ...normal, ...normal);
            }
            
            return { positions: new Float32Array(positions), normals: new Float32Array(normals), count: positions.length / 3 };
        }

        function createParticles(count) {
            const positions = [];
            for (let i = 0; i < count; i++) {
                positions.push(
                    (Math.random() - 0.5) * 20,
                    (Math.random() - 0.5) * 20,
                    (Math.random() - 0.5) * 20 - 5
                );
            }
            return new Float32Array(positions);
        }

        const icosahedron = createIcosahedron();
        const particles = createParticles(200);

        const positionBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, icosahedron.positions, gl.STATIC_DRAW);

        const normalBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, normalBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, icosahedron.normals, gl.STATIC_DRAW);

        const particleBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, particleBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, particles, gl.STATIC_DRAW);

        function perspective(fov, aspect, near, far) {
            const f = 1.0 / Math.tan(fov / 2);
            return new Float32Array([
                f / aspect, 0, 0, 0,
                0, f, 0, 0,
                0, 0, (far + near) / (near - far), -1,
                0, 0, (2 * far * near) / (near - far), 0
            ]);
        }

        function lookAt(eye, center, up) {
            const f = normalize([center[0] - eye[0], center[1] - eye[1], center[2] - eye[2]]);
            const s = normalize(cross(f, up));
            const u = cross(s, f);
            
            return new Float32Array([
                s[0], u[0], -f[0], 0,
                s[1], u[1], -f[1], 0,
                s[2], u[2], -f[2], 0,
                -dot(s, eye), -dot(u, eye), dot(f, eye), 1
            ]);
        }

        function normalize(v) {
            const len = Math.sqrt(v[0]**2 + v[1]**2 + v[2]**2);
            return [v[0]/len, v[1]/len, v[2]/len];
        }

        function cross(a, b) {
            return [
                a[1]*b[2] - a[2]*b[1],
                a[2]*b[0] - a[0]*b[2],
                a[0]*b[1] - a[1]*b[0]
            ];
        }

        function dot(a, b) {
            return a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
        }

        function rotateX(angle) {
            const c = Math.cos(angle), s = Math.sin(angle);
            return new Float32Array([
                1, 0, 0, 0,
                0, c, s, 0,
                0, -s, c, 0,
                0, 0, 0, 1
            ]);
        }

        function rotateY(angle) {
            const c = Math.cos(angle), s = Math.sin(angle);
            return new Float32Array([
                c, 0, -s, 0,
                0, 1, 0, 0,
                s, 0, c, 0,
                0, 0, 0, 1
            ]);
        }

        function multiplyMatrices(a, b) {
            const result = new Float32Array(16);
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    result[i * 4 + j] = 
                        a[i * 4 + 0] * b[0 * 4 + j] +
                        a[i * 4 + 1] * b[1 * 4 + j] +
                        a[i * 4 + 2] * b[2 * 4 + j] +
                        a[i * 4 + 3] * b[3 * 4 + j];
                }
            }
            return result;
        }

        function getNormalMatrix(modelMatrix) {
            const m = modelMatrix;
            const a00 = m[0], a01 = m[1], a02 = m[2];
            const a10 = m[4], a11 = m[5], a12 = m[6];
            const a20 = m[8], a21 = m[9], a22 = m[10];
            
            const b01 = a22 * a11 - a12 * a21;
            const b11 = -a22 * a10 + a12 * a20;
            const b21 = a21 * a10 - a11 * a20;
            
            let det = a00 * b01 + a01 * b11 + a02 * b21;
            if (!det) det = 1;
            det = 1.0 / det;
            
            return new Float32Array([
                b01 * det,
                (-a22 * a01 + a02 * a21) * det,
                (a12 * a01 - a02 * a11) * det,
                b11 * det,
                (a22 * a00 - a02 * a20) * det,
                (-a12 * a00 + a02 * a10) * det,
                b21 * det,
                (-a21 * a00 + a01 * a20) * det,
                (a11 * a00 - a01 * a10) * det
            ]);
        }

        let time = 0;
        
        function render() {
            time += 0.01;
            
            gl.clearColor(0.04, 0.04, 0.06, 1.0);
            gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
            gl.enable(gl.DEPTH_TEST);
            gl.enable(gl.BLEND);
            gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

            const aspect = canvas.width / canvas.height;
            const projectionMatrix = perspective(Math.PI / 4, aspect, 0.1, 100);
            const cameraPos = [Math.sin(time * 0.3) * 6, 2, Math.cos(time * 0.3) * 6];
            const viewMatrix = lookAt(cameraPos, [0, 0, 0], [0, 1, 0]);

            gl.useProgram(particleProgram);
            gl.uniformMatrix4fv(particleLocations.uProjectionMatrix, false, projectionMatrix);
            gl.uniformMatrix4fv(particleLocations.uViewMatrix, false, viewMatrix);
            gl.uniform1f(particleLocations.uPointSize, 3.0);
            gl.uniform3f(particleLocations.uColor, 0.6, 0.7, 1.0);
            
            gl.bindBuffer(gl.ARRAY_BUFFER, particleBuffer);
            gl.enableVertexAttribArray(particleLocations.aPosition);
            gl.vertexAttribPointer(particleLocations.aPosition, 3, gl.FLOAT, false, 0, 0);
            gl.drawArrays(gl.POINTS, 0, particles.length / 3);

            gl.useProgram(mainProgram);
            
            const modelMatrix = multiplyMatrices(rotateY(time * 0.5), rotateX(time * 0.3));
            const normalMatrix = getNormalMatrix(modelMatrix);
            
            gl.uniformMatrix4fv(mainLocations.uProjectionMatrix, false, projectionMatrix);
            gl.uniformMatrix4fv(mainLocations.uViewMatrix, false, viewMatrix);
            gl.uniformMatrix4fv(mainLocations.uModelMatrix, false, modelMatrix);
            gl.uniformMatrix3fv(mainLocations.uNormalMatrix, false, normalMatrix);
            gl.uniform3f(mainLocations.uLightPos, 5, 5, 5);
            gl.uniform3fv(mainLocations.uCameraPos, cameraPos);
            gl.uniform3f(mainLocations.uColor, 0.2, 0.6, 0.9);

            gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
            gl.enableVertexAttribArray(mainLocations.aPosition);
            gl.vertexAttribPointer(mainLocations.aPosition, 3, gl.FLOAT, false, 0, 0);

            gl.bindBuffer(gl.ARRAY_BUFFER, normalBuffer);
            gl.enableVertexAttribArray(mainLocations.aNormal);
            gl.vertexAttribPointer(mainLocations.aNormal, 3, gl.FLOAT, false, 0, 0);

            gl.drawArrays(gl.TRIANGLES, 0, icosahedron.count);

            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
